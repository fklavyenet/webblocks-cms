name: Bug report
description: Report a problem with WebBlocks CMS
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        ⚠️ **Do not report security vulnerabilities here.** Please follow our
        [Security Policy](https://github.com/fklavyenet/webblocks-cms/security/policy) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this has not been reported yet.
          required: true
        - label: I am running the latest release of WebBlocks CMS.
          required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I ..., I expected ..., but instead ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WebBlocks CMS version
      placeholder: e.g. 1.34.11
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      options:
        - Package consumer (composer require into a Laravel app)
        - Cloned repository + install wizard
        - Manual CLI install
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, database (SQLite/MySQL/MariaDB), OS, web server.
      placeholder: |
        - PHP: 8.3
        - Database: MySQL 8.0
        - OS: Ubuntu 22.04
        - Web server: Nginx
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant log output. Remove secrets, tokens, and passwords first.
      render: shell
    validations:
      required: false
