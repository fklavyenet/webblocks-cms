name: Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, zip, sqlite3, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php84-${{ hashFiles('composer.json') }}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - run: composer audit
      - run: composer format:test
      - run: composer test

  php83-framework-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: '12'
            laravel: '12.*'
            testbench: '^10.11'
          - major: '13'
            laravel: '13.*'
            testbench: '^11.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, zip, sqlite3, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-php83-laravel-${{ matrix.major }}-${{ hashFiles('composer.json') }}
      - run: composer update --no-interaction --prefer-dist --no-progress --with="laravel/framework:${{ matrix.laravel }}" --with="orchestra/testbench:${{ matrix.testbench }}"
      - run: composer check-platform-reqs
      - run: composer test

  current-laravel-consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, zip, sqlite3, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2
      - run: tests/Support/check-current-consumer.sh
        env:
          LARAVEL_VERSION: ${{ matrix.laravel }}

  laravel-floor-resolution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        floor: ['12.55.*', '13.0.*']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sodium, zip, fileinfo
          coverage: none
          tools: composer:v2
      - run: tests/Support/check-laravel-floor.sh
        env:
          LARAVEL_FLOOR: ${{ matrix.floor }}

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: tests/Support/check-dist.sh

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: php tests/Support/check-docs.php
