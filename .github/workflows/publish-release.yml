name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    env:
      PRODUCT_KEY: webblocks-cms
      DEFAULT_CHANNEL: stable
      SOURCE_TYPE: github
      MINIMUM_CLIENT_VERSION: 1.32.18

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate publish token
        env:
          WEBBLOCKS_PUBLISH_TOKEN: ${{ secrets.WEBBLOCKS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$WEBBLOCKS_PUBLISH_TOKEN" ]; then
            printf 'WEBBLOCKS_PUBLISH_TOKEN is required.\n' >&2
            exit 1
          fi

      - name: Resolve publisher URL
        id: publish-url
        env:
          WEBBLOCKS_PUBLISH_URL: ${{ secrets.WEBBLOCKS_PUBLISH_URL }}
        run: |
          publish_url="$WEBBLOCKS_PUBLISH_URL"

          if [ -z "$publish_url" ]; then
            publish_url='https://updates.webblocksui.com/api/updates/publish'
          fi

          printf 'value=%s\n' "$publish_url" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG_NAME#v}"

          if [ "$version" = "$TAG_NAME" ] || [ -z "$version" ]; then
            printf 'Tag %s does not start with v.\n' "$TAG_NAME" >&2
            exit 1
          fi

          release_url="https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/webblocks-cms-${version}.zip"
          release_time="$(git for-each-ref --format='%(creatordate:iso8601-strict)' "refs/tags/${TAG_NAME}")"

          if [ -z "$release_time" ]; then
            printf 'Failed to resolve release time for tag %s.\n' "$TAG_NAME" >&2
            exit 1
          fi

          printf 'tag=%s\n' "$TAG_NAME" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'release_url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"
          printf 'released_at=%s\n' "$release_time" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          set -euo pipefail

          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          notes=''

          if [ -f CHANGELOG.md ]; then
            notes="$(awk -v version="$version" '
              $0 ~ "^##[[:space:]]+\\[?" version "\\]?([[:space:]]|$)" {capture=1; next}
              capture && $0 ~ "^##[[:space:]]+" {exit}
              capture {print}
            ' CHANGELOG.md)"
          fi

          if [ -z "$notes" ]; then
            notes="$(git tag -l --format='%(contents)' "$tag")"
          fi

          if [ -z "$notes" ]; then
            notes="Release ${tag} for WebBlocks CMS."
          fi

          printf '%s\n' "$notes" > release-notes.md

          {
            printf 'System Updates source/dev status presentation fix\n'
          } > release-title.txt

          {
            printf 'This release prevents source-maintained checkouts from showing stale actionable updates when the local code version is already current, and keeps resolved failed update runs as history instead of primary warnings.\n'
          } > release-summary.txt

          {
            printf 'Update availability now depends on the latest published version being strictly newer than the effective installed CMS version.\n'
            printf 'Source-maintained development checkouts use the newer local code version for update-status presentation without mutating the stored installed version.\n'
            printf 'Stale failed update runs remain inspectable in collapsed historical details instead of driving the main System Updates status.\n'
          } > release-highlights.txt

          {
            printf 'Fixes cases where an old failed update run could make an already-current source checkout look like an actionable update was still available.\n'
            printf 'Keeps Update Options hidden unless there is a current actionable update target.\n'
            printf 'Preserves currently relevant failed, pending, or running update-run visibility for the active target.\n'
          } > release-fixes.txt

          {
            printf 'Compatible clients continue to render structured release detail metadata; older clients continue to use release_notes.\n'
            printf 'Package-consumer update behavior, compatibility checks, CSRF handling, pending backup flow, and update guards are unchanged.\n'
            printf 'The package-rooted update metadata still uses the configured bridge-capable minimum client version.\n'
          } > release-compatibility-notes.txt

          {
            printf 'No database migration is required for this release.\n'
          } > release-migration-notes.txt

          {
            printf 'No frontend build chain, Vite, npm, Tailwind, or package asset compilation requirement is added.\n'
          } > release-asset-notes.txt

          {
            printf 'For local source-maintained development checkouts, apply source changes through the normal development workflow rather than in-app System Updates.\n'
            printf 'When the checkout code version is already equal to or newer than the latest published release, System Updates now reports the install as current and does not show Update now.\n'
            printf 'Resolved failed runs can still be reviewed from collapsed historical update-run details.\n'
          } > release-operator-notes.txt

          {
            printf 'The GitHub tag workflow publishes structured fields in top-level, details, and release_details form shapes for publisher compatibility.\n'
            printf 'Update status uses version comparison instead of update-run history as the source of current availability.\n'
            printf 'Source-maintained checkout detection reuses the maintenance repository Composer autoload signal for WebBlocks CMS package source authority.\n'
            printf 'Checksums, artifact URLs, raw responses, diagnostics, and low-level update server values remain in collapsed technical details.\n'
          } > release-technical-notes.txt

      - name: Build release archive
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          output_dir='dist'
          archive_path="${output_dir}/webblocks-cms-${version}.zip"
          staging_dir="$(mktemp -d)"
          package_root='packages/webblocks-cms'

          mkdir -p "$output_dir"
          rm -f "$archive_path" "${archive_path}.sha256"

          cleanup() {
            rm -rf "$staging_dir"
          }

          trap cleanup EXIT

          git archive --format=tar --worktree-attributes HEAD "$package_root" | tar -xf - -C "$staging_dir"

          package_dir="$staging_dir/$package_root"

          if [ ! -f "$package_dir/composer.json" ]; then
            printf 'Package composer.json not found at %s.\n' "$package_dir" >&2
            exit 1
          fi

          (
            cd "$package_dir"
            zip -qr "$GITHUB_WORKSPACE/$archive_path" .
          )

          shasum -a 256 "$archive_path" | cut -d' ' -f1 > "${archive_path}.sha256"

      - name: Capture archive checksum
        id: checksum
        run: |
          archive_path="dist/webblocks-cms-${{ steps.release.outputs.version }}.zip"
          checksum="$(cut -d' ' -f1 "${archive_path}.sha256")"

          if [ -z "$checksum" ]; then
            printf 'Failed to read archive checksum.\n' >&2
            exit 1
          fi

          printf 'value=%s\n' "$checksum" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          archive_path="dist/webblocks-cms-${{ steps.release.outputs.version }}.zip"
          checksum_path="${archive_path}.sha256"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive_path" "$checksum_path" --clobber
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" \
              "$archive_path" \
              "$checksum_path" \
              --title "$tag" \
              --notes-file release-notes.md
          fi

      - name: Publish release package to WebBlocks Publisher
        env:
          WEBBLOCKS_PUBLISH_TOKEN: ${{ secrets.WEBBLOCKS_PUBLISH_TOKEN }}
          PUBLISH_URL: ${{ steps.publish-url.outputs.value }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          CHECKSUM: ${{ steps.checksum.outputs.value }}
        run: |
          archive_path="dist/webblocks-cms-${VERSION}.zip"

          if [ ! -f "$archive_path" ]; then
            printf 'Archive %s not found.\n' "$archive_path" >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            --url "$PUBLISH_URL" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${WEBBLOCKS_PUBLISH_TOKEN}" \
            --form "product=${PRODUCT_KEY}" \
            --form "version=${VERSION}" \
            --form "channel=${DEFAULT_CHANNEL}" \
            --form "minimum_client_version=${MINIMUM_CLIENT_VERSION}" \
            --form "title=<release-title.txt" \
            --form "summary=<release-summary.txt" \
            --form "highlights=<release-highlights.txt" \
            --form "fixes=<release-fixes.txt" \
            --form "compatibility_notes=<release-compatibility-notes.txt" \
            --form "migration_notes=<release-migration-notes.txt" \
            --form "asset_notes=<release-asset-notes.txt" \
            --form "operator_notes=<release-operator-notes.txt" \
            --form "technical_notes=<release-technical-notes.txt" \
            --form "details[title]=<release-title.txt" \
            --form "details[summary]=<release-summary.txt" \
            --form "details[highlights]=<release-highlights.txt" \
            --form "details[fixes]=<release-fixes.txt" \
            --form "details[compatibility_notes]=<release-compatibility-notes.txt" \
            --form "details[migration_notes]=<release-migration-notes.txt" \
            --form "details[asset_notes]=<release-asset-notes.txt" \
            --form "details[operator_notes]=<release-operator-notes.txt" \
            --form "details[technical_notes]=<release-technical-notes.txt" \
            --form "release_details[title]=<release-title.txt" \
            --form "release_details[summary]=<release-summary.txt" \
            --form "release_details[highlights]=<release-highlights.txt" \
            --form "release_details[fixes]=<release-fixes.txt" \
            --form "release_details[compatibility_notes]=<release-compatibility-notes.txt" \
            --form "release_details[migration_notes]=<release-migration-notes.txt" \
            --form "release_details[asset_notes]=<release-asset-notes.txt" \
            --form "release_details[operator_notes]=<release-operator-notes.txt" \
            --form "release_details[technical_notes]=<release-technical-notes.txt" \
            --form "release_notes=<release-notes.md" \
            --form "notes=GitHub release package publish for ${TAG_NAME}" \
            --form "source_reference=${TAG_NAME}" \
            --form "checksum_sha256=${CHECKSUM}" \
            --form "package=@${archive_path};type=application/zip"
