# One-command WebBlocks CMS demo (single container, SQLite).
#
#   docker compose up --build
#
# Then open http://localhost:8080 and sign in at /webadmin with
# admin@example.com / password. This is a demo, not a production setup.

services:
  webblocks:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /app/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      DEMO_ADMIN_EMAIL: admin@example.com
      DEMO_ADMIN_PASSWORD: password
